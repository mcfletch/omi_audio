[tox]
# `playback` installs miniaudio, so the decode and real-device paths are
# exercised; `nobackend` leaves it out, so the silent paths -- which are what a
# machine with no sound card actually runs -- are exercised as themselves rather
# than through a monkeypatch.
#
# Opus is the third axis, and it has two suppliers. Every env decodes it through
# the system `libopus` where the machine has one -- which is the Linux case, and
# which CI installs (see .github/workflows/test.yml) -- while `bundled` adds
# `opuslib-next-bundled`, the wheel-supplied library that `omi_audio[opus]`
# installs and the only one Windows and macOS get. `omi_audio._opus` prefers the
# wheel and falls back to the system, so the two suppliers are two code paths
# and one env of each runs them.
envlist =
    lint
    typecheck
    py310-{playback,nobackend}
    py311-{playback,nobackend}
    py312-{playback,nobackend}
    py313-{playback,nobackend}
    py314-{playback,nobackend}
    py315-{playback,nobackend}
    pypy3-nobackend
    py312-playback-bundled
skip_missing_interpreters = true

[testenv]
package = sdist
deps =
    pytest
    pytest-cov
    playback: miniaudio>=1.59
    bundled: opuslib-next-bundled>=0.1.1
commands_pre =
    playback: python -c "from omi_audio import miniaudio_available; assert miniaudio_available(); print('backend: miniaudio')"
    nobackend: python -c "from omi_audio import miniaudio_available; assert not miniaudio_available(); print('backend: silence')"
    bundled: python -c "from opuslib_next import _loader; print('libopus: bundled', _loader.load_libopus())"
# The threshold is a floor that must not be argued down, not a target: with
# branch coverage on and a `libopus` present the suite sits between 96% and 98%
# depending on the env, and a contribution that drops it below 95 has added code
# nothing exercises.  It is deliberately below the lowest of those figures,
# which is the `nobackend` envs: they cannot reach the backend decode paths at
# all.  A machine with no `libopus` has the Opus decode tests skip themselves
# and lands about two points lower again, which is why CI installs one rather
# than leaving the codec to the runner image.
commands =
    pytest {posargs:-q} --cov --cov-report=term-missing --cov-fail-under=95

# Lint and types are gates rather than good intentions.  Both were declared in
# the `dev` extra and run nowhere, which meant the clean state the package
# enjoyed was unenforced and would rot on the first contribution.
[testenv:lint]
skip_install = true
deps = ruff
commands = ruff check .

# No `python_version` is pinned in pyproject, so this checks the package under
# whichever interpreter tox chose.  Add more factors to check the floor and the
# ceiling rather than one version in the middle.
[testenv:typecheck]
deps =
    mypy
    numpy>=2.0
    pytest
commands = mypy --strict src/omi_audio

# The diagrams in docs/images are generated from omi_audio.spatial.  This
# redraws them; `pytest tests/test_diagrams.py` is what fails if they are stale.
[testenv:diagrams]
commands = python docs/make_diagrams.py

[testenv:docs]
extras = docs
commands = sphinx-build -W --keep-going -b html docs/api {posargs:docs/_build/html}

# tox-gh maps a CI interpreter to the envs it should run (see .github/workflows).
[gh]
python =
    3.10 = py310-playback, py310-nobackend
    3.11 = py311-playback, py311-nobackend
    3.12 = lint, typecheck, py312-playback, py312-nobackend, py312-playback-bundled
    3.13 = py313-playback, py313-nobackend
    3.14 = py314-playback, py314-nobackend
    3.15 = py315-playback, py315-nobackend
    pypy-3.10 = pypy3-nobackend
