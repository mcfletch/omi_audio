  <rect x="296" y="24" width="264" height="250" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 5"/>
  <text x="428.00" y="46.00" fill="#a8a8a8" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600">positional</text>
  <g opacity="1">
  <circle cx="370.00" cy="204.00" r="6.0" fill="#3d8fd8"/>
