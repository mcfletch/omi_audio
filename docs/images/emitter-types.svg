  <text x="148.00" y="84.00" fill="#e05252" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="normal">emitter</text>
  <text x="148.00" y="250.00" fill="#a8a8a8" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="normal">fixed to the listener; heard the</text>
