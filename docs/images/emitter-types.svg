  <line x1="486.00" y1="204.00" x2="494.00" y2="104.00" stroke="#e05252" stroke-width="1.0" stroke-dasharray="2 4"/>
  <text x="428.00" y="250.00" fill="#a8a8a8" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="normal">fixed in the world; the distance,</text>
  <text x="428.00" y="268.00" fill="#a8a8a8" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="normal">cone and pan all change</text>
  <text x="288.00" y="300.00" fill="#a8a8a8" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="normal">A global emitter has no PositionalProperties at all — the extension forbids them,</text>
  <text x="288.00" y="318.00" fill="#a8a8a8" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="normal">and a scene (which has no transform) may carry only this kind.</text>
