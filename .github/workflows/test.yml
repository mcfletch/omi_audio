name: tests

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:
  # `release.yml` runs this on every push to main and then decides whether the
  # version is worth publishing, so main is covered from there rather than by a
  # `push:` trigger here -- which would run the whole matrix twice per push.
  workflow_call:

jobs:
  test:
    name: ${{ matrix.python-version }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "pypy-3.10"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # `libopus` is not a runner component. Without one, `omi_audio._opus`
      # reports Opus undecodable, every test that turns packets into samples
      # skips itself, and the run lands the wrong side of the coverage floor in
      # tox.ini -- so the decoder that reads the codec `KHR_audio_emitter`
      # prefers would be shipped unexercised. The runtime package is the whole
      # requirement: the binding is ctypes over the soname, not a compile, so
      # there is no header and no `-dev` to install.
      - name: Install libopus
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopus0

      # Asserted rather than assumed, because the failure is otherwise silent: a
      # renamed package, or a library ctypes cannot find, costs a handful of
      # skipped tests and two points of coverage and says nothing about why.
      - name: Check the system libopus loads
        run: |
          python -c 'import ctypes, ctypes.util; name = ctypes.util.find_library("opus"); assert name, "libopus0 is installed but ctypes found no libopus"; ctypes.CDLL(name); print("libopus:", name)'

      - name: Install tox
        run: python -m pip install --upgrade pip tox tox-gh

      # tox-gh reads the [gh] table in tox.ini and runs the envs mapped to this
      # interpreter: with the playback backend installed, and without it. The
      # runner has no sound card, which is exactly the silent path the library
      # is required to survive. The 3.12 row additionally runs `lint` and
      # `typecheck`, so ruff and mypy gate a merge rather than being declared in
      # an extra and run nowhere, and the `bundled` env, which decodes Opus
      # through the `libopus` inside the `opuslib-next-bundled` wheel -- the only
      # one Windows and macOS users get -- rather than through the system one
      # installed above. Coverage is measured in every test env with a floor of
      # 95% (see tox.ini).
      - name: Run tox
        run: tox

  # Python 3.15 is still a prerelease, so it is reported and not required: a
  # regression in a CPython beta is worth seeing on the next push, and is not a
  # reason to hold up a merge or a release. `continue-on-error` is what keeps a
  # failure here visible without failing the run, which is why this is a job of
  # its own rather than another row of the matrix above -- the checks list then
  # says plainly which results are binding.
  prerelease:
    name: 3.15 (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          allow-prereleases: true
      # The same codec the matrix needs, for the same reasons.
      - name: Install libopus
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopus0
      - name: Install tox
        run: python -m pip install --upgrade pip tox tox-gh
      - name: Run tox
        run: tox

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip tox
      # -W, so a broken cross-reference in the API reference fails the build
      # rather than shipping as a dead link.
      - name: Build the API reference
        run: tox -e docs
      - uses: actions/upload-artifact@v4
        with:
          name: api-reference
          path: docs/_build/html
